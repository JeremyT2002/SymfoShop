# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    payment_default_provider: 'dev'
    # Placeholder when STRIPE_SECRET_KEY is not set (e.g. using PAYMENT_PROVIDER=dev). Set STRIPE_SECRET_KEY in .env.local for real Stripe.
    stripe_secret_key_default: 'sk_test_placeholder'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Stripe client (optional when using dev provider; set STRIPE_SECRET_KEY in .env.local for Stripe)
    Stripe\StripeClient:
        arguments:
            - '%env(default:stripe_secret_key_default:STRIPE_SECRET_KEY)%'

    # Payment providers (tagged for registry)
    App\Service\Payment\Provider\StripePaymentProvider:
        arguments:
            $webhookSecret: '%env(default::STRIPE_WEBHOOK_SECRET)%'
        tags:
            - { name: 'payment.provider' }

    App\Service\Payment\Provider\DevPaymentProvider:
        tags:
            - { name: 'payment.provider' }

    App\Service\Payment\Provider\PayPalPaymentProvider:
        tags:
            - { name: 'payment.provider' }

    App\Service\Payment\Provider\KlarnaPaymentProvider:
        tags:
            - { name: 'payment.provider' }

    App\Controller\Checkout\CheckoutController:
        arguments:
            $orderWorkflow: '@state_machine.order'
            $checkoutSkipPayment: '%env(bool:CHECKOUT_SKIP_PAYMENT)%'
            $kernelEnvironment: '%kernel.environment%'

    App\Controller\Dev\DevPaymentSimulatorController:
        arguments:
            $orderWorkflow: '@state_machine.order'
            $kernelEnvironment: '%kernel.environment%'

    # Theme resolver (use app cache pool)
    App\Theme\ThemeResolver:
        arguments:
            $cache: '@cache.app'

    # Payment provider registry
    App\Service\Payment\PaymentProviderRegistry:
        arguments:
            $providerIterable: !tagged_iterator payment.provider
            $defaultProviderName: '%env(default:payment_default_provider:PAYMENT_PROVIDER)%'

    # Payment service
    App\Service\Payment\PaymentService:
        arguments:
            $registry: '@App\Service\Payment\PaymentProviderRegistry'

    # Webhook controller
    App\Controller\Webhook\StripeWebhookController:
        arguments:
            $stripeWebhookSecret: '%env(default::STRIPE_WEBHOOK_SECRET)%'

    # Invoice services
    App\Service\Invoice\PdfInvoiceGenerator:
        arguments:
            $invoiceStoragePath: '%kernel.project_dir%/var/invoices'

    # Workflow guard events
    App\Workflow\Order\OrderWorkflowGuard:
        arguments:
            $checkoutSkipPayment: '%env(bool:CHECKOUT_SKIP_PAYMENT)%'
            $environment: '%kernel.environment%'
        tags:
            - { name: 'kernel.event_listener', event: 'workflow.order.guard.submit_payment', method: guardSubmitPayment }
            - { name: 'kernel.event_listener', event: 'workflow.order.guard.confirm_payment', method: guardConfirmPayment }
            - { name: 'kernel.event_listener', event: 'workflow.order.guard.start_processing', method: guardStartProcessing }
            - { name: 'kernel.event_listener', event: 'workflow.order.guard.ship', method: guardShip }
            - { name: 'kernel.event_listener', event: 'workflow.order.guard.complete', method: guardComplete }
            - { name: 'kernel.event_listener', event: 'workflow.order.guard.cancel', method: guardCancel }

    # Audit log subscriber
    App\EventSubscriber\AuditLogSubscriber:
        tags:
            - { name: 'doctrine.event_subscriber' }

    # Alias for Nelmio RenderOpenApi
    Nelmio\ApiDocBundle\Render\RenderOpenApi: '@nelmio_api_doc.render_docs'

    # Product image upload service
    App\Service\Product\ImageUploadService:
        arguments:
            $uploadsDirectory: '%kernel.project_dir%/public/uploads'