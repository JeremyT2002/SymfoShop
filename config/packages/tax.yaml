# VAT configuration (used by App\Service\Tax\TaxCalculator).
#
# Product prices are entered GROSS (incl. VAT of the shop's home country). Customers inside the EU pay the
# same gross price; the VAT contained in it is shown at checkout and on the invoice. Deliveries outside the
# EU are exports: the home-country VAT is removed and no VAT is charged.
#
# Check the rates against the current official values before going live — they change from time to time.
parameters:
    app.tax.home_country: '%env(default:app.tax.home_country_default:SHOP_COUNTRY)%'
    app.tax.home_country_default: 'DE'

    # One-Stop-Shop: true = VAT rate of the customer's EU country (required above the EU-wide
    # 10,000 EUR distance-selling threshold), false = home-country rate for all EU customers.
    app.tax.oss: '%env(bool:default:app.tax.oss_default:TAX_OSS)%'
    app.tax.oss_default: false

    # Per EU member state: [standard, reduced] rate in percent
    app.tax.eu_rates:
        AT: [20, 10]
        BE: [21, 6]
        BG: [20, 9]
        CY: [19, 5]
        CZ: [21, 12]
        DE: [19, 7]
        DK: [25, 25]
        EE: [24, 9]
        ES: [21, 10]
        FI: [25.5, 14]
        FR: [20, 5.5]
        GR: [24, 13]
        HR: [25, 5]
        HU: [27, 5]
        IE: [23, 13.5]
        IT: [22, 10]
        LT: [21, 9]
        LU: [17, 8]
        LV: [21, 12]
        MT: [18, 7]
        NL: [21, 9]
        PL: [23, 8]
        PT: [23, 6]
        RO: [21, 11]
        SE: [25, 12]
        SI: [22, 9.5]
        SK: [23, 19]
